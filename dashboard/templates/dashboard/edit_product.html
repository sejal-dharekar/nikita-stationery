{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>Add Product | Nikita Stationery</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<style>

.form-box {
    max-width: 750px;
    margin: auto;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input,
.form-group textarea,
.form-group select {
    max-width: 100%;
    width: 100%;
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

.cancel-btn {
    background: #e8eef8;
    color: #173b7a;
    padding: 10px 18px;
    border-radius: 6px;
    font-weight: bold;
}

</style>

</head>

<body>

<nav class="navbar">

<h2 style="color:white;">
NIKITA STATIONERY
</h2>

<div>
<a href="{% url 'dashboard' %}">Dashboard</a>
<a href="{% url 'manage_products' %}">Products</a>
<a href="{% url 'manage_orders' %}">Orders</a>
</div>

</nav>


<div class="page-container">

<div class="form-box">

<div class="card">

<h1>➕ Add Product</h1>

<p style="color:#64748b;">
Add a new stationery product
</p>

<br>

<form method="POST" enctype="multipart/form-data">
    <div class="form-group">

    <label>
        Product Photo
    </label>

    {% if product.image %}

        <div style="margin-bottom:12px;">

            <img
                src="{{ product.image.url }}"
                alt="{{ product.name }}"
                style="
                    width:120px;
                    height:120px;
                    object-fit:cover;
                    border-radius:10px;
                    border:1px solid #e2e8f0;
                "
            >

        </div>

    {% endif %}

    <input
        type="file"
        name="image"
        accept="image/*"
    >

    <p style="color:#64748b;font-size:12px;">
        Choose a new photo only if you want to replace the current one.
    </p>

</div>

{% csrf_token %}


<div class="form-group">

<label>Product Name</label>

<input
type="text"
name="name"
placeholder="Example: Classmate Notebook"
required
>

</div>


<div class="form-group">

<label>Category</label>

<select name="category" required>

<option value="">
Select Category
</option>

{% for category in categories %}

<option value="{{ category.id }}">
{{ category.name }}
</option>

{% endfor %}

</select>

</div>


<div class="form-group">

<label>Description</label>

<textarea
name="description"
rows="5"
placeholder="Product description"
required
></textarea>

</div>


<div class="form-group">

<label>Price (₹)</label>

<input
type="number"
name="price"
step="0.01"
min="0"
required
>

</div>


<div class="form-group">

<label>Stock</label>

<input
type="number"
name="stock"
min="0"
required
>

</div>


<div class="form-group">

<label>Product Image</label>

<input
type="file"
name="image"
accept="image/*"
>

</div>


<div class="form-actions">

<button type="submit">
Save Product
</button>

<a
href="{% url 'manage_products' %}"
class="cancel-btn"
>
Cancel
</a>

</div>

</form>

</div>

</div>

</div>

</body>
</html>
